<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161C22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Run Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#161C22; --surface:#1E262E; --surfaceHi:#263039; --line:#33404B;
    --text:#E2E8EC; --muted:#7A8894; --dim:#4E5A65;
    --sandal:#E3A552; --brooks:#6E93B0; --strength:#9C8DB4; --done:#86A98C;
    --run1:#7F9DB8; --run2:#9B8CB3; --run3:#B78D9B;
    --display:'Barlow Condensed',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --sans:'IBM Plex Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{max-width:100%;overflow-x:hidden}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);
       padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
  .wrap{width:100%;max-width:600px;margin:0 auto;padding:24px 16px 64px}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  button:focus-visible{outline:2px solid var(--sandal);outline-offset:2px}
  h1{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:.02em;line-height:1}
  .sub{color:var(--muted);font-size:12px;margin-top:4px}
  .topbar{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .topActions{position:relative;display:flex;gap:8px;flex:0 0 auto}
  .savedState{position:absolute;top:13px;right:92px;color:var(--done);font:500 10px var(--mono);opacity:0;transition:opacity .2s;white-space:nowrap}
  .dataMenuButton,.trendButton{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--sandal)}
  .trendButton{text-decoration:none}
  .trendButton:hover,.trendButton:active{border-color:var(--sandal);background:var(--surfaceHi)}
  .dataMenuButton[aria-expanded="true"]{border-color:var(--sandal);background:var(--surfaceHi)}
  .dataMenuButton svg,.trendButton svg,.dataMenuAction svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .dataMenu{position:absolute;z-index:45;top:44px;right:0;width:218px;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--surface);box-shadow:0 12px 32px rgba(0,0,0,.42)}
  .dataMenu[hidden]{display:none}
  .dataMenuHead{padding:3px 5px 7px;color:var(--muted);font:500 9px var(--mono);letter-spacing:.12em}
  .dataMenuAction{width:100%;display:flex;align-items:center;gap:9px;min-height:36px;padding:7px 9px;border-radius:5px;color:var(--text);font-size:12px;text-align:left}
  .dataMenuAction:hover,.dataMenuAction:active{background:var(--surfaceHi)}
  .dataMenuAction svg{flex:0 0 auto;color:var(--sandal)}
  .dataMenuAction:disabled{opacity:.5}
  .dataMenuAction + .dataMenuAction{margin-top:2px}
  .dataStatus{min-height:0;margin:5px 4px 1px;color:var(--muted);font:500 9px/1.35 var(--mono)}
  .dataStatus:empty{display:none}
  .dataStatus.ok{color:var(--done)}
  .dataStatus.error{color:#D58B82}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
  .ridge{padding:16px;margin:20px 0}
  .eyebrow{color:var(--muted);font-size:10px;letter-spacing:.14em;margin-bottom:12px}
  .bars{display:flex;align-items:flex-end;gap:6px;height:92px}
  .bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
  .bars i{position:relative;display:block;overflow:hidden;border-radius:2px;background:var(--surfaceHi)}
  .bars i.cur{border:1.5px solid var(--sandal)}
  .bars b{position:absolute;left:0;right:0;bottom:0;display:block;background:var(--sandal);transition:height .22s}
  .nums{display:flex;gap:6px;margin-top:8px}
  .nums span{flex:1;text-align:center;font-family:var(--mono);font-size:10px;color:var(--dim)}
  .nums span.cur{color:var(--sandal)}
  .weeks{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
  .wkTile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
       min-width:0;padding:11px 2px;border:1px solid var(--line);border-radius:8px;background:var(--surface);
       transition:border-color .22s ease,background .22s ease,box-shadow .28s ease}
  .wkTileName{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:.02em;line-height:1;color:var(--muted);
       transition:color .22s ease}
  .wkTileCount{font-family:var(--mono);font-size:9px;line-height:1;color:var(--dim);transition:color .22s ease}
  .wkTileRound{position:absolute;top:3px;right:4px;font:500 7px var(--mono);color:var(--dim)}
  .wkTile.done .wkTileName,.wkTile.done .wkTileCount{color:var(--done)}
  .wkTile.cur{border-color:rgba(227,165,82,.5)}
  .wkTile.cur .wkTileName{color:var(--sandal)}
  .wkTile:hover{border-color:var(--dim)}
  .wkTile.sel{background:var(--surfaceHi);border-color:var(--sandal);
       box-shadow:0 0 0 1px rgba(227,165,82,.3),0 8px 22px rgba(0,0,0,.34)}
  .wkTile.sel .wkTileName{color:var(--sandal)}
  .wkTile.sel::after{content:"";position:absolute;left:50%;bottom:-5px;width:8px;height:8px;
       transform:translateX(-50%) rotate(45deg);background:var(--surfaceHi);
       border-right:1px solid var(--sandal);border-bottom:1px solid var(--sandal)}
  /* The panel is a full-width grid row that grows from 0fr; the negative
     block margin cancels the grid gap while it is closed. */
  .wkPanel{grid-column:1/-1;align-self:start;display:grid;grid-template-rows:0fr;margin-block:-8px;
       transition:grid-template-rows .44s cubic-bezier(.16,1,.3,1),margin-block .44s cubic-bezier(.16,1,.3,1)}
  .wkPanel.open{grid-template-rows:1fr;margin-block:0}
  .wkPanelInner{min-height:0;overflow:hidden}
  .wkPanelCard{opacity:0;transform:translateY(-10px);
       transition:opacity .34s ease .06s,transform .46s cubic-bezier(.16,1,.3,1) .04s}
  .wkPanel.open .wkPanelCard{opacity:1;transform:none}
  .wkPanelHead{display:flex;align-items:center;gap:10px;padding:13px 16px 12px}
  .wkClose{margin-left:2px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;
       border-radius:6px;color:var(--muted);font-size:13px}
  .wkClose:hover,.wkClose:active{color:var(--sandal);background:var(--surfaceHi)}
  .wkname{font-family:var(--display);font-size:22px;font-weight:600;line-height:1}
  .wkname.cur{color:var(--sandal)}
  .round{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:12px}
  .count{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto}
  .caret{color:var(--muted);font-size:18px;font-weight:700;line-height:1;margin-left:8px}
  .runs{border-top:1px solid var(--line)}
  .day{border-bottom:1px solid var(--line)}
  .day:last-child{border-bottom:none}
  .run{width:100%;display:flex;gap:12px;padding:12px 16px;text-align:left;align-items:center}
  .run.done{opacity:.5}
  .runCheck{flex:0 0 auto}
  .runCheck .box{margin-top:0}
  .runToggle{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:6px;padding:4px;text-align:left}
  .run .runname{margin-bottom:0}
  .runBody{padding:0 16px 4px 50px}
  .runMetrics{display:flex;flex-wrap:wrap;gap:10px;width:100%;max-width:100%;margin-top:10px}
  .runMetric{display:block;flex:0 0 104px;min-width:0;color:var(--dim);font:500 8px var(--mono);letter-spacing:.07em}
  .runMetric.wide{flex:0 0 126px}
  .runMetricInput{display:block;width:100%;height:34px;margin-top:4px;padding:3px 5px;border:1px solid var(--line);border-radius:4px;background:var(--surfaceHi);color:var(--text);font:500 16px var(--mono);text-align:center;-moz-appearance:textfield}
  .runMetricInput::-webkit-inner-spin-button,.runMetricInput::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .runMetricInput:focus{outline:1.5px solid var(--sandal);border-color:var(--sandal)}
  .runMetricInput::placeholder{color:var(--dim)}
  .box{flex:0 0 auto;width:20px;height:20px;margin-top:2px;border-radius:5px;border:1.5px solid var(--dim);
       display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--bg)}
  .run.done .box{background:var(--done);border-color:var(--done)}
  .runname{font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.04em;margin-bottom:6px;color:var(--accent,var(--text))}
  .run.done .runname{text-decoration:line-through}
  .feelLog{padding:0 16px 12px 50px}
  .feelLog.workoutLog{padding:4px 0 0 0;border-bottom:none}
  .offDay{border-bottom:1px solid var(--line);background:rgba(38,48,57,.38)}
  .offDay:last-child{border-bottom:none}
  .offDay.done{opacity:.5}
  .offDayHead{display:flex;align-items:center;gap:10px;padding:10px 16px 8px 16px}
  .offDayCheck{flex:0 0 auto}
  .offDayCheck .box{margin-top:0}
  .offDay.done .box{background:var(--done);border-color:var(--done)}
  .offDayToggle{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:6px;padding:4px;text-align:left}
  .offDayLabel{flex:1 1 auto;min-width:0}
  .offDayTitle{font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
  .offDay.done .offDayTitle{text-decoration:line-through}
  .offDayContext{padding:0 16px 0 50px;color:var(--dim);font:500 9px var(--mono);letter-spacing:.08em;text-transform:uppercase}
  .feelLog.offDayLog{padding:0 16px 12px 50px}
  .feelBtns{display:flex;gap:6px;width:210px;max-width:100%;margin-top:8px}
  .feelBtn{flex:1 1 0;min-width:0;padding:7px 6px;border:1px solid var(--line);border-radius:4px;color:var(--muted);font-size:11px;font-weight:600}
  .feelBtn.on{background:rgba(227,165,82,.15);border-color:var(--sandal);color:var(--sandal)}
  .noteBtn{display:block;width:210px;max-width:100%;height:30px;margin-top:7px;padding:6px 8px;border:1px solid var(--line);border-radius:4px;
       background:var(--surfaceHi);color:var(--dim);font:500 12px var(--sans);text-align:left;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .noteBtn.has{color:var(--text)}
  .noteBtn:active{border-color:var(--sandal)}
  .modal{position:fixed;top:0;left:0;right:0;height:100%;z-index:50;display:flex;align-items:flex-end;justify-content:center;
       background:rgba(11,15,19,.74)}
  .modal[hidden]{display:none}
  .sheet{width:100%;max-width:600px;max-height:100%;display:flex;flex-direction:column;
       background:var(--surface);border:1px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0;
       padding:14px 16px max(14px,env(safe-area-inset-bottom)) 16px}
  .modal.kb .sheet{padding-bottom:12px}
  .sheetHead{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
  .sheetHead .eyebrow{margin-bottom:0}
  .noteText{flex:1 1 auto;width:100%;min-height:110px;resize:none;overflow-y:auto;padding:10px;
       border:1px solid var(--line);border-radius:6px;background:var(--surfaceHi);color:var(--text);
       font:400 16px/1.5 var(--sans);-webkit-appearance:none}
  .noteText:focus{outline:1.5px solid var(--sandal);border-color:var(--sandal)}
  .noteText::placeholder{color:var(--dim)}
  .line{display:flex;gap:8px;align-items:baseline;margin-bottom:4px}
  .tag{font-family:var(--mono);font-size:9px;letter-spacing:.1em;width:52px;flex:0 0 52px}
  .val{font-family:var(--mono);font-size:12px}
  .runMinutes{color:var(--dim);font:500 9px var(--mono);white-space:nowrap}
  .wkt{font-size:11px;color:var(--muted);line-height:1.4}
  .wkt em{font-style:normal;color:var(--dim);display:block}
  .workout{padding-top:2px}
  .workout.done{opacity:.5}
  .workoutHead{display:flex;align-items:center;gap:10px;padding:10px 16px 8px 16px}
  .workoutCheck{flex:0 0 auto}
  .workoutCheck .box{margin-top:0}
  .workout.done .box{background:var(--done);border-color:var(--done)}
  .workoutTitle{flex:1 1 auto;min-width:0;font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.04em;color:var(--accent,var(--strength))}
  .workout.done .workoutTitle{text-decoration:line-through}
  .workoutToggle{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:6px;padding:4px;color:var(--dim);font-size:11px;text-align:left}
  .strength{padding:0 16px 12px 70px}
  .strengthRow{display:flex;align-items:center;gap:8px;margin-top:8px;min-width:0}
  .exercise{flex:1 1 auto;min-width:76px;color:var(--text);font-size:12px;line-height:1.25;overflow-wrap:anywhere}
  .sets{display:flex;gap:5px;flex:0 0 auto}
  .setInput{width:42px;height:34px;padding:3px 4px;border:1px solid var(--line);border-radius:4px;background:var(--surfaceHi);
       color:var(--text);font:500 16px var(--mono);text-align:center}
  .setInput:focus{outline:1.5px solid var(--sandal);border-color:var(--sandal)}
  .setInput::placeholder{color:var(--dim)}
  .repNav{position:fixed;z-index:60;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);
       width:min(360px,calc(100% - 24px));display:flex;align-items:center;gap:6px;padding:7px;
       border:1px solid var(--line);border-radius:8px;background:rgba(30,38,46,.98);box-shadow:0 8px 28px rgba(0,0,0,.38)}
  .repNav[hidden]{display:none}
  .repNav button{min-height:36px;padding:7px 10px;border:1px solid var(--line);border-radius:5px;background:var(--surfaceHi);font-size:13px;font-weight:600}
  .repNav button:disabled{opacity:.35;cursor:default}
  .repNav .repDone{background:var(--sandal);border-color:var(--sandal);color:var(--bg)}
  .repPosition{flex:1;text-align:center;color:var(--muted);font:500 10px var(--mono)}
  .gate{padding:12px 16px;border-top:1px solid var(--line);background:var(--surfaceHi)}
  .gate p{font-size:12px;margin-bottom:8px;line-height:1.5}
  .row{display:flex;gap:8px}
  .pick{flex:1;padding:8px;border-radius:4px;background:var(--surface);border:1px solid var(--line);font-size:12px}
  .solid{padding:8px 12px;border-radius:4px;background:var(--sandal);color:var(--bg);font-size:12px;font-weight:600}
  .ghost{padding:8px 12px;border-radius:4px;border:1px solid var(--line);color:var(--muted);font-size:12px}
  .note{padding:16px;margin-top:8px}
  .note p{font-size:12px;line-height:1.6;margin-top:8px}
  .note p:first-of-type{margin-top:0}
  .entryDelete{flex:0 0 auto;width:26px;height:26px;display:flex;align-items:center;justify-content:center;
       border-radius:5px;color:var(--dim);font-size:13px}
  .entryDelete:hover,.entryDelete:active{color:#D58B82;background:var(--surfaceHi)}
  .entryDate{color:var(--dim);font:500 9px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
  .dateRow{display:flex;align-items:flex-end;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .dateField{display:block;flex:0 0 126px;max-width:100%;color:var(--dim);font:500 8px var(--mono);letter-spacing:.07em}
  .dateField span{display:block;margin-bottom:4px}
  .typeRowDate{margin-left:auto}
  .dateInput{display:block;width:100%;height:34px;padding:3px 4px;border:1px solid var(--line);border-radius:4px;
       background:var(--surfaceHi);color:var(--text);font:500 13px var(--mono);text-align:center;-webkit-appearance:none}
  .dateInput:focus{outline:1.5px solid var(--sandal);border-color:var(--sandal)}
  .dateInput::-webkit-calendar-picker-indicator{filter:invert(.7);padding-left:2px}
  .dateHint{flex:1 1 auto;min-width:0;padding-bottom:9px;color:var(--dim);font:500 9px var(--mono);letter-spacing:.06em}
  .dateHintRow{margin:-4px 0 10px;color:var(--dim);font:500 9px var(--mono);letter-spacing:.06em}
  .exDelete{flex:0 0 auto;width:24px;height:24px;display:flex;align-items:center;justify-content:center;
       border-radius:5px;color:var(--dim);font-size:12px}
  .exDelete:hover,.exDelete:active{color:#D58B82;background:var(--surfaceHi)}
  .exAddRow{display:flex;gap:6px;margin-top:12px}
  .exAddInput{flex:1 1 auto;min-width:0;height:32px;padding:4px 8px;border:1px dashed var(--line);border-radius:5px;
       background:var(--surfaceHi);color:var(--text);font:400 14px var(--sans)}
  .exAddInput:focus{outline:1.5px solid var(--sandal);border-color:var(--sandal);border-style:solid}
  .exAddInput::placeholder{color:var(--dim)}
  .exAddBtn{flex:0 0 auto;padding:0 12px;border:1px solid var(--line);border-radius:5px;color:var(--sandal);font-size:13px;font-weight:600}
  .exAddBtn:hover,.exAddBtn:active{border-color:var(--sandal);background:var(--surfaceHi)}
  .exMeta{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
  .exMetaBtn{color:var(--dim);font:500 9px var(--mono);letter-spacing:.06em;text-decoration:underline;padding:2px 0}
  .exMetaBtn:hover,.exMetaBtn:active{color:var(--sandal)}
  .exEmpty{margin-top:8px;color:var(--dim);font:500 10px var(--mono)}
  .addRow{display:flex;gap:8px;padding:12px 16px}
  .addBtn{flex:1 1 0;padding:9px 8px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);
       font-size:11px;font-weight:600;text-align:center}
  .addBtn:hover,.addBtn:active{border-color:var(--sandal);border-style:solid;color:var(--sandal);background:var(--surfaceHi)}
  .typeRow{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .typeLabel{color:var(--dim);font:500 9px var(--mono);letter-spacing:.08em;margin-right:2px}
  .typeBtn{width:28px;height:26px;border:1px solid var(--line);border-radius:4px;color:var(--muted);font-size:11px;font-weight:600}
  .typeBtn.on{background:rgba(156,141,180,.18);border-color:var(--strength);color:var(--strength)}
  .typeAuto{color:var(--dim);font:500 9px var(--mono);text-decoration:underline;padding:4px}
  .typeAutoNote{color:var(--dim);font:500 9px var(--mono)}
  .typeFlag{color:var(--sandal);font:600 8px var(--mono);letter-spacing:.06em;border:1px solid var(--sandal);
       border-radius:3px;padding:1px 4px;margin-left:6px}
  .protoBlock{border-bottom:1px solid var(--line)}
  .protoToggle{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;
       text-align:left;color:var(--muted);font:500 10px var(--mono);letter-spacing:.06em}
  .protoToggle:hover,.protoToggle:active{color:var(--sandal)}
  .protoPanel{padding:0 16px 14px}
  .protoRun{margin-top:10px}
  .protoRun:first-child{margin-top:0}
  .protoRunName{font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.06em;margin-bottom:6px}
  .protoGrid{display:flex;align-items:flex-end;gap:8px;margin-bottom:6px}
  .protoBlockName{flex:0 0 58px;font:500 9px var(--mono);letter-spacing:.05em}
  .protoField{flex:1 1 0;min-width:0}
  .protoField span{display:block;color:var(--dim);font:500 8px var(--mono);letter-spacing:.05em;margin-bottom:3px}
  .protoField span i{font-style:normal}
  .protoInput{width:100%;height:30px;padding:3px 4px;border:1px solid var(--line);border-radius:4px;
       background:var(--surfaceHi);color:var(--text);font:500 13px var(--mono);text-align:center}
  .protoInput:focus{outline:1.5px solid var(--sandal);border-color:var(--sandal)}
  .protoActions{margin-top:10px}
  @media (max-width:420px){
    .weeks{gap:6px}
    .wkPanel{margin-block:-6px}
    .wkTile{padding:10px 1px}
    .wkTileName{font-size:15px}
    .strength{padding-left:16px}
    .strengthRow{gap:6px}
    .exercise{min-width:0}
    .sets{gap:4px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>RUN TRACKER</h1>
      <div class="sub">Sandal minutes per week.<br>Everything else serves that.</div>
    </div>
    <div class="topActions">
      <div class="savedState" id="saved">saved</div>
      <a class="trendButton" href="feelings.html" aria-label="Open feel trends" title="Feel trends">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16"></path><path d="m7 15 4-4 3 2 5-6"></path></svg>
      </a>
      <button class="dataMenuButton" id="dataMenuButton" type="button" aria-label="Open data menu" aria-controls="dataMenu" aria-expanded="false" title="Data and export">

          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"></rect><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path></svg>
          <span class="dataMenuLabel">Copy JSON</span>

<script>
const WORKOUTS={A:"Pull-up · Bridge · Handstand",B:"Pushup · Squat · Leg Raise"};
const ACC="Heel raises · Side plank · Copenhagen";
const S="3 / 90s / 3", L="3 / 90s / 4", X="4 / 90s / 4";
const WEEKS=[
 {n:1,runs:[[S,S],[S,S],[S,S]]},
 {n:2,runs:[[S,S],[S,S],[S,S]]},
 {n:3,runs:[[L,S],[S,S],[S,S]]},
 {n:4,runs:[[L,S],[S,S],[L,S]]},
 {n:5,runs:[[L,S],[L,S],[L,S]]},
 {n:6,runs:[[X,S],[L,S],[L,S]]},
 {n:7,runs:[[X,S],[L,S],[X,S]]},
 {n:8,runs:[[X,L],[X,L],[X,L]]}
];

// --- running protocol ---------------------------------------------------
// A run is two blocks (sandals, then Brooks). Each block is
// [run 1 minutes, walk seconds, run 2 minutes] — six editable numbers per run.
const parseSegments=s=>{
  const v=String(s).match(/\d+(?:\.\d+)?/g)||[];
  return [Number(v[0]||0),Number(v[1]||0),Number(v[2]||0)];
};
const BROOKS_LAST_WEEK=5;
const hasBrooks=wn=>Number(wn)<=BROOKS_LAST_WEEK;
const DEFAULT_PROTOCOL={};
WEEKS.forEach(w=>{DEFAULT_PROTOCOL[w.n]=w.runs.map(r=>({s:parseSegments(r[0]),b:hasBrooks(w.n)?parseSegments(r[1]):[0,0,0]}));});
const defaultWeekProtocol=wn=>DEFAULT_PROTOCOL[wn].map(p=>({s:p.s.slice(),b:p.b.slice()}));
const segLabel=seg=>`${seg[0]} / ${seg[1]}s / ${seg[2]}`;
const segMinutes=seg=>Number(seg[0])+Number(seg[2]);
const SEG_FIELDS=[["RUN 1",0,"min"],["WALK",1,"sec"],["RUN 2",2,"min"]];
const SEG_BLOCKS=[["s","SANDALS","--sandal"],["b","BROOKS","--brooks"]];
const blocksFor=wn=>SEG_BLOCKS.filter(([block])=>block!=="b"||hasBrooks(wn));

const KEY="sandal-transition-tracker";
const PROTO_KEY="sandal-transition-protocol";
const GH_KEYS={
  token:"sandal-transition-github-token",
  owner:"sandal-transition-github-owner",
  repo:"sandal-transition-github-repo",
  branch:"sandal-transition-github-branch"
};
const SNAPSHOT_KEYS=[KEY,PROTO_KEY,GH_KEYS.owner,GH_KEYS.repo,GH_KEYS.branch];
const emptyState=()=>({done:{},feel:{},repeats:{},sets:{},workouts:{},workoutOpen:{},runMetrics:{},runFeels:{},runNotes:{},workoutFeels:{},workoutNotes:{},offDayDone:{},offDayFeels:{},offDayNotes:{},sessionHistory:[],entries:[],workoutAt:{},workoutType:{},workoutTypeOverride:{},runAt:{},exerciseTemplates:{},workoutExercises:{}});
let st=emptyState();
let proto={};
let openWeek=null;
let runOpen={}, workoutOpen={}, offDayOpen={}, protoOpen={};
let storageOK=true;

function defaultProtocol(){const o={};WEEKS.forEach(w=>{o[w.n]=defaultWeekProtocol(w.n);});return o;}
function loadProtocol(){
  let parsed=null;
  try{const raw=localStorage.getItem(PROTO_KEY); if(raw) parsed=JSON.parse(raw);}
  catch(e){ storageOK=false; }
  proto=defaultProtocol();
  if(parsed&&typeof parsed==="object"){
    WEEKS.forEach(w=>{
      const week=parsed[w.n];
      if(!Array.isArray(week)) return;
      week.forEach((p,i)=>{
        if(!p||!proto[w.n][i]) return;
        blocksFor(w.n).forEach(([block])=>{
          if(!Array.isArray(p[block])) return;
          p[block].forEach((v,n)=>{
            const num=Number(v);
            if(n<3&&Number.isFinite(num)&&num>=0) proto[w.n][i][block][n]=num;
          });
        });
      });
    });
  }
  // First load seeds storage from the hardcoded values so nothing changes visually.
  if(!parsed) saveProtocol();
}
function saveProtocol(){
  try{localStorage.setItem(PROTO_KEY,JSON.stringify(proto));}
  catch(e){ storageOK=false; }
}
const runProtocol=(wn,i)=>(proto[wn]&&proto[wn][i])||DEFAULT_PROTOCOL[wn][i];
const weekSandalMinutes=wn=>(proto[wn]||DEFAULT_PROTOCOL[wn]).reduce((sum,p)=>sum+segMinutes(p.s),0);

function load(){
  try{
    const r=localStorage.getItem(KEY);
    if(r) st=Object.assign(emptyState(),JSON.parse(r));
    if(!Array.isArray(st.sessionHistory)) st.sessionHistory=[];
    if(!Array.isArray(st.entries)) st.entries=[];
    ["workoutAt","workoutType","workoutTypeOverride","runAt","exerciseTemplates","workoutExercises"].forEach(k=>{
      if(!st[k]||typeof st[k]!=="object") st[k]={};
    });
  }
  catch(e){ storageOK=false; }
  loadProtocol();
  migrate();
}
function save(silent){
  const s=document.getElementById("saved");
  try{
    localStorage.setItem(KEY,JSON.stringify(st));
    if(silent) return;
    s.textContent="saved"; s.style.color="var(--done)";
    s.style.opacity=1; setTimeout(()=>s.style.opacity=0,1200);
  }catch(e){
    storageOK=false;
    if(silent) return;
    s.textContent="session only"; s.style.color="var(--sandal)";
    s.style.opacity=1;
  }
}

const GRID_COLS=6;
const wkDone=w=>w.runs.every((_,i)=>st.done[w.n+"-"+i]);
const wkCount=w=>w.runs.filter((_,i)=>st.done[w.n+"-"+i]).length;
const current=()=>WEEKS.find(w=>!wkDone(w))||WEEKS[WEEKS.length-1];
// openWeek: null = follow the current week, -1 = everything closed.
function openWeekNumber(){
  if(openWeek===null) return current().n;
  return WEEKS.some(w=>w.n===openWeek)?openWeek:null;
}
const reducedMotion=()=>!!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);
const canAnimatePanel=()=>!reducedMotion()&&!!(window.CSS&&CSS.supports&&CSS.supports("grid-template-rows","0fr"));
// Grow the freshly rendered panel from nothing. Two frames: the first lets the
// collapsed state resolve, the second flips it so the transition actually runs.
function openPanel(){
  const node=document.getElementById("wkPanel");
  if(!node) return;
  if(!canAnimatePanel()){ node.classList.add("open"); return; }
  requestAnimationFrame(()=>requestAnimationFrame(()=>node.classList.add("open")));
}
// Collapse the panel that is on screen, then hand back to the caller. The
// timeout is the safety net for a transitionend that never arrives.
function closePanel(done){
  const node=document.getElementById("wkPanel");
  if(!node||!node.classList.contains("open")||!canAnimatePanel()){ done(); return; }
  let settled=false;
  const finish=()=>{
    if(settled) return;
    settled=true;
    node.removeEventListener("transitionend",onEnd);
    done();
  };
  const onEnd=e=>{ if(e.target===node&&e.propertyName==="grid-template-rows") finish(); };
  node.addEventListener("transitionend",onEnd);
  setTimeout(finish,520);
  node.classList.remove("open");
}
function revealWeek(n){
  openWeek=n;
  render(true);
  openPanel();
  requestAnimationFrame(()=>{
    const sel=document.querySelector(".wkTile.sel");
    if(sel) sel.scrollIntoView({block:"nearest",behavior:reducedMotion()?"auto":"smooth"});
  });
}
const parts=s=>s.split(/\s+[^A-Za-z0-9]+\s+/);
const strengthRowsFor=letter=>[...parts(WORKOUTS[letter]||WORKOUTS.A),...parts(ACC)];

// --- exercise lists -----------------------------------------------------
// Each workout type has an editable default list; an individual workout may
// carry its own list in st.workoutExercises, which wins. Set values are keyed
// by exercise NAME, so adding or removing a row never shifts anyone's reps.
const DEFAULT_EXERCISES={A:strengthRowsFor("A"),B:strengthRowsFor("B")};
const cleanExercise=n=>String(n||"").replace(/\|/g,"/").replace(/\s+/g," ").trim();
function templateFor(letter){
  const t=st.exerciseTemplates[letter];
  return Array.isArray(t)?t.slice():(DEFAULT_EXERCISES[letter]||DEFAULT_EXERCISES.A).slice();
}
function exercisesFor(key,letter){
  const list=st.workoutExercises[key];
  return Array.isArray(list)?list.slice():templateFor(letter||typeFor(key));
}
const sameList=(a,b)=>a.length===b.length&&a.every((v,i)=>v===b[i]);
function knownExercises(){
  const seen=new Set([...DEFAULT_EXERCISES.A,...DEFAULT_EXERCISES.B]);
  ["A","B"].forEach(l=>templateFor(l).forEach(x=>seen.add(x)));
  Object.values(st.workoutExercises).forEach(l=>{ if(Array.isArray(l)) l.forEach(x=>seen.add(x)); });
  st.sessionHistory.forEach(h=>{ if(h&&h.sets) Object.keys(h.sets).forEach(x=>seen.add(x)); });
  return [...seen].filter(Boolean).sort((a,b)=>a.localeCompare(b));
}
function addExercise(key,name){
  const clean=cleanExercise(name);
  if(!clean) return false;
  const list=exercisesFor(key);
  if(list.some(x=>x.toLowerCase()===clean.toLowerCase())) return false;
  list.push(clean);
  st.workoutExercises[key]=list;
  return true;
}
function removeExercise(key,name){
  const list=exercisesFor(key);
  const at=list.indexOf(name);
  if(at<0) return false;
  const logged=[0,1,2].some(si=>st.sets[`${key}|${name}|${si}`]);
  if(logged&&!confirm(`Remove "${name}" from this workout? Its logged sets will be deleted.`)) return false;
  list.splice(at,1);
  st.workoutExercises[key]=list;
  [0,1,2].forEach(si=>delete st.sets[`${key}|${name}|${si}`]);
  const ref=refFor(key);
  if(ref&&st.workouts[key]) recordCompletedSession(ref);
  return true;
}

// --- dates --------------------------------------------------------------
const pad2=n=>String(n).padStart(2,"0");
function toDateInput(iso){
  if(!iso) return "";
  const d=new Date(iso);
  if(isNaN(d.getTime())) return "";
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
// Re-date an entry while keeping whatever time of day it already carried.
function withDate(iso,ymd){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(ymd||"");
  if(!m) return null;
  const base=iso?new Date(iso):null;
  const ok=base&&!isNaN(base.getTime());
  return new Date(Number(m[1]),Number(m[2])-1,Number(m[3]),
    ok?base.getHours():12,ok?base.getMinutes():0,0,0).toISOString();
}
const dateField=(kind,key,iso,label,opts)=>{
  const o=opts||{};
  return `<label class="dateField ${o.cls||""}">${o.bare?"":`<span>DATE</span>`}<input class="dateInput" type="date" data-date-kind="${kind}" data-date-key="${key}" value="${toDateInput(iso)}" aria-label="${esc(label)}"></label>`;
};
function applyDateEdit(kind,key,ymd){
  if(kind==="run"){
    const iso=withDate(st.runAt[key],ymd);
    if(iso) st.runAt[key]=iso; else delete st.runAt[key];
    return;
  }
  if(kind==="off"){
    const entry=st.entries.find(e=>e&&e.id===key);
    if(!entry) return;
    const iso=withDate(entry.at,ymd);
    entry.at=iso;
    if(iso) delete entry.migrated;
    return;
  }
  if(kind!=="workout") return;
  const ref=refFor(key);
  if(!ref) return;
  let iso;
  if(ref.scope==="solo"){
    iso=withDate(ref.entry.at,ymd);
    ref.entry.at=iso;
    if(iso) delete ref.entry.migrated;
  } else {
    iso=withDate(st.workoutAt[key],ymd);
    if(iso) st.workoutAt[key]=iso; else delete st.workoutAt[key];
  }
  refreshOrder();
  if(st.workouts[key]) recordCompletedSession(ref,iso||undefined);
}
const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// --- workout identity ---------------------------------------------------
// A workout is either paired to a run (key "<week>-<run>", unchanged from
// before) or standalone (key = the entry id, "s..."). Both kinds key into the
// same feel / note / set / done buckets, so no stored value had to move.
const legacyWorkoutFor=(wn,i)=>((wn-1)*3+i)%2?"B":"A";
const pairedKey=(wn,i)=>wn+"-"+i;
const pairedRef=(wn,i)=>({scope:"run",key:pairedKey(wn,i),wn,i});
const soloRef=e=>({scope:"solo",key:e.id,entry:e});
const workoutEntries=()=>st.entries.filter(e=>e&&e.kind==="workout");
const weekEntries=wn=>st.entries
  .filter(e=>e&&e.week===wn)
  .sort((a,b)=>(a.after||0)-(b.after||0)||(Date.parse(a.at||"")||0)-(Date.parse(b.at||"")||0)||String(a.id).localeCompare(String(b.id)));
const historyIdFor=ref=>ref.scope==="run"?`${ref.wn}-${ref.i}-r${st.repeats[ref.wn]||0}`:ref.key;
const setKeyFor=(ref,exercise,si)=>`${ref.key}|${exercise}|${si}`;
function refFor(key){
  const m=/^(\d+)-(\d+)$/.exec(key);
  if(m){
    const wn=Number(m[1]), i=Number(m[2]);
    if(WEEKS[wn-1]&&WEEKS[wn-1].runs[i]) return pairedRef(wn,i);
  }
  const e=st.entries.find(x=>x&&x.id===key&&x.kind==="workout");
  return e?soloRef(e):null;
}

// Every workout, paired and standalone, in one chronological order.
// Completed paired workouts carry a real timestamp in st.workoutAt; ones
// finished before timestamps existed keep their program position ahead of
// everything dated. Unfinished paired workouts are pushed past "now" so a
// standalone entry logged today always sorts before the rest of the plan.
function orderedWorkouts(){
  const now=Date.now();
  const list=[];
  let cursor=0;
  WEEKS.forEach(w=>w.runs.forEach((_,i)=>{
    const ref=pairedRef(w.n,i);
    ref.done=!!st.workouts[ref.key];
    const t=Date.parse(st.workoutAt[ref.key]||"");
    if(Number.isFinite(t)) cursor=Math.max(t,cursor+1);
    else if(ref.done) cursor=cursor+1;
    else cursor=Math.max(cursor+1,now+1);
    ref.t=cursor;
    list.push(ref);
  }));
  workoutEntries().forEach(e=>{
    const ref=soloRef(e);
    ref.done=!!st.workouts[e.id];
    const t=Date.parse(e.at||"");
    ref.t=Number.isFinite(t)?t:0;
    list.push(ref);
  });
  return list.sort((a,b)=>a.t-b.t||(a.scope===b.scope?0:a.scope==="run"?-1:1));
}
// A manual override wins; then the letter frozen when the workout was
// completed; otherwise the opposite of whatever came before it in the order.
function resolveWorkoutTypes(order){
  const types={};
  let prev=null;
  order.forEach(ref=>{
    const letter=st.workoutTypeOverride[ref.key]||st.workoutType[ref.key]||(prev==="A"?"B":"A");
    types[ref.key]=letter;
    prev=letter;
  });
  return types;
}
let ORDER=[], TYPES={};
function refreshOrder(){
  ORDER=orderedWorkouts();
  TYPES=resolveWorkoutTypes(ORDER);
}
const typeFor=key=>TYPES[key]||"A";

function sessionSnapshot(ref,completedAt){
  const type=typeFor(ref.key);
  const exercises=exercisesFor(ref.key,type);
  const sets={};
  exercises.forEach(exercise=>{
    sets[exercise]=[0,1,2].map(si=>st.sets[setKeyFor(ref,exercise,si)]??null);
  });
  return {
    id:historyIdFor(ref),
    scope:ref.scope,
    workoutType:type,
    week:ref.scope==="run"?ref.wn:(ref.entry&&ref.entry.week)||null,
    run:ref.scope==="run"?ref.i:null,
    round:ref.scope==="run"?(st.repeats[ref.wn]||0):0,
    completedAt:completedAt||new Date().toISOString(),
    sets
  };
}
function recordCompletedSession(ref,completedAt){
  const id=historyIdFor(ref);
  const at=st.sessionHistory.findIndex(s=>s&&s.id===id);
  const prior=at>=0?st.sessionHistory[at]:null;
  const entry=sessionSnapshot(ref,completedAt||(prior&&prior.completedAt));
  if(at>=0) st.sessionHistory[at]=entry; else st.sessionHistory.push(entry);
}
function removeCurrentSession(ref){
  const id=historyIdFor(ref);
  st.sessionHistory=st.sessionHistory.filter(s=>!s||s.id!==id);
}
// The previous edition of this workout: the nearest completed workout of the
// same type anywhere in the unified order — paired or standalone.
function previousSession(ref){
  const type=typeFor(ref.key);
  const index=ORDER.findIndex(r=>r.key===ref.key);
  if(index<0) return null;
  for(let n=index-1;n>=0;n--){
    const prev=ORDER[n];
    if(!prev.done||typeFor(prev.key)!==type) continue;
    const session=st.sessionHistory.find(s=>s&&s.id===historyIdFor(prev));
    if(session) return session;
  }
  return null;
}
function previousSetValue(session,exercise,setIndex){
  const value=session&&session.sets&&session.sets[exercise]?session.sets[exercise][setIndex]:null;
  return value===null||value===undefined?"":String(value);
}

const OFF_DAY_CONTEXT=["day after Run 1","day after Run 2","day after Run 3","second day after Run 3"];
function migrate(){
  let changed=false;
  // 1. Freeze the letter every already-completed paired workout was shown
  //    under, so replacing index parity can never rewrite history.
  WEEKS.forEach(w=>w.runs.forEach((_,i)=>{
    const key=pairedKey(w.n,i);
    if(st.workouts[key]&&!st.workoutType[key]){ st.workoutType[key]=legacyWorkoutFor(w.n,i); changed=true; }
  }));
  // 2. Mirror real completion dates into the ordering map.
  st.sessionHistory.forEach(s=>{
    if(!s) return;
    if(!s.scope){ s.scope="run"; changed=true; }
    if(s.scope!=="run"||s.week===null||s.week===undefined) return;
    const key=pairedKey(s.week,s.run);
    if(st.workoutAt[key]) return;
    const t=Date.parse(s.completedAt);
    if(Number.isFinite(t)){ st.workoutAt[key]=new Date(t).toISOString(); changed=true; }
  });
  refreshOrder();
  // 2b. Set values used to be keyed by exercise INDEX ("<workout>-<ei>-<si>").
  //     Re-key them by exercise name so rows can be added and removed freely.
  Object.keys(st.sets).forEach(k=>{
    const m=/^(.+)-(\d+)-(\d+)$/.exec(k);
    if(!m) return;
    const wkey=m[1], ei=Number(m[2]), si=Number(m[3]);
    if(si>2||!refFor(wkey)) return;
    const name=(DEFAULT_EXERCISES[typeFor(wkey)]||DEFAULT_EXERCISES.A)[ei];
    const value=st.sets[k];
    delete st.sets[k];
    changed=true;
    if(name!==undefined&&st.sets[`${wkey}|${name}|${si}`]===undefined) st.sets[`${wkey}|${name}|${si}`]=value;
  });
  // 3. Completed paired workouts that predate sessionHistory entirely.
  WEEKS.forEach(w=>w.runs.forEach((_,i)=>{
    const ref=pairedRef(w.n,i);
    if(st.workouts[ref.key]&&!st.sessionHistory.some(s=>s&&s.id===historyIdFor(ref))){
      recordCompletedSession(ref,`legacy-${String(w.n).padStart(2,"0")}-${i}`);
      changed=true;
    }
  }));
  // 4. Off-day slots holding data become standalone entries. The entry id is
  //    the old "<week>-<slot>" key, so the feel / note / done values stay
  //    exactly where they are and feelings.html keeps reading them.
  const known=new Set(st.entries.map(e=>e&&e.id));
  const slots=new Set();
  [st.offDayDone,st.offDayFeels,st.offDayNotes].forEach(bucket=>{
    Object.entries(bucket||{}).forEach(([k,v])=>{ if(v&&/^\d+-\d+$/.test(k)) slots.add(k); });
  });
  [...slots].sort().forEach(k=>{
    if(known.has(k)) return;
    const [wn,slot]=k.split("-").map(Number);
    if(!WEEKS[wn-1]||slot>3) return;
    st.entries.push({id:k,kind:"off",week:wn,after:Math.min(slot+1,3),at:null,migrated:true,context:OFF_DAY_CONTEXT[slot]||""});
    changed=true;
  });
  refreshOrder();
  if(changed) save(true);
}

// --- standalone entries -------------------------------------------------
const newEntryId=()=>"s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function addEntry(kind,wn){
  const week=WEEKS[wn-1];
  if(!week) return null;
  const runsDone=week.runs.filter((_,i)=>st.done[pairedKey(wn,i)]).length;
  const entry={id:newEntryId(),kind,week:wn,after:runsDone,at:new Date().toISOString()};
  st.entries.push(entry);
  if(kind==="workout") workoutOpen[entry.id]=true; else offDayOpen[entry.id]=true;
  return entry;
}
function deleteEntry(id){
  const entry=st.entries.find(e=>e&&e.id===id);
  if(!entry) return false;
  const label=entry.kind==="workout"?"workout":"off-day";
  if(!confirm(`Delete this ${label} entry? Its feel, note${entry.kind==="workout"?" and sets":""} will be removed.`)) return false;
  st.entries=st.entries.filter(e=>e&&e.id!==id);
  if(entry.kind==="workout"){
    ["workouts","workoutFeels","workoutNotes","workoutAt","workoutType","workoutTypeOverride","workoutExercises"].forEach(b=>delete st[b][id]);
    Object.keys(st.sets).forEach(k=>{ if(k.startsWith(id+"|")) delete st.sets[k]; });
    st.sessionHistory=st.sessionHistory.filter(s=>!s||s.id!==id);
    delete workoutOpen[id];
  } else {
    ["offDayDone","offDayFeels","offDayNotes"].forEach(b=>delete st[b][id]);
    delete offDayOpen[id];
  }
  return true;
}
const entryStamp=e=>{
  if(!e.at) return e.context||"logged earlier";
  const d=new Date(e.at);
  if(isNaN(d.getTime())) return e.context||"";
  return d.toLocaleString(undefined,{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
};

const FEELS=[
  ["Smooth","form held, nothing notable"],
  ["OK","some fatigue or mild soreness, form degraded late"],
  ["Rough","pain, form broke down, or anything localized"]
];
const feelLog=(type,k,selected,note,extraClass="")=>`<div class="feelLog ${extraClass}">
  <div class="feelBtns">
    ${FEELS.map(([v,title])=>`<button class="feelBtn ${selected===v?"on":""}" data-log-type="${type}" data-log-key="${k}" data-log-value="${v}" title="${title}" aria-pressed="${selected===v}">${v}</button>`).join("")}
  </div>
  <button class="noteBtn ${note?"has":""}" data-note-type="${type}" data-note-key="${k}" aria-label="${note?"Edit note":"Add note"}">${note?esc(preview(note)):"+ note"}</button>
</div>`;
const preview=n=>String(n).replace(/\s+/g," ").trim();
const feelBucket=type=>type==="run"?st.runFeels:type==="workout"?st.workoutFeels:st.offDayFeels;
const noteBucket=type=>type==="run"?st.runNotes:type==="workout"?st.workoutNotes:st.offDayNotes;

function offDayHtml(e){
  const k=e.id;
  const open=!!offDayOpen[k];
  const done=!!st.offDayDone[k];
  return `<div class="day soloDay"><div class="offDay ${done?"done":""}">
    <div class="offDayHead">
      <button class="offDayCheck" data-off-day="${k}" aria-pressed="${done}" aria-label="Mark off day ${done?"not done":"done"}"><span class="box">${done?"✓":""}</span></button>
      <button class="offDayToggle" data-off-day-open="${k}" aria-expanded="${open}">
        <span class="offDayLabel"><span class="offDayTitle">OFF DAY</span></span>
        <span class="caret">${open?"▾":"▸"}</span>
      </button>
      <button class="entryDelete" data-delete-entry="${k}" aria-label="Delete off day entry" title="Delete">✕</button>
    </div>
    ${open?`<div class="offDayContext"><div class="dateRow">${dateField("off",k,e.at,"Off day date")}${e.at?"":`<span class="dateHint">${esc(entryStamp(e))}</span>`}</div></div>${feelLog("off",k,st.offDayFeels[k],st.offDayNotes[k],"offDayLog")}`:""}
  </div></div>`;
}

function workoutHtml(ref,options){
  const opts=options||{};
  const key=ref.key;
  const letter=typeFor(key);
  const exercises=exercisesFor(key,letter);
  const done=!!st.workouts[key];
  const open=!!workoutOpen[key];
  const override=st.workoutTypeOverride[key];
  const prior=previousSession(ref);
  const label=opts.label||`Workout ${letter}`;
  const dateIso=ref.scope==="solo"?(ref.entry&&ref.entry.at):st.workoutAt[key];
  const typeRow=`<div class="typeRow">
    <span class="typeLabel">TYPE</span>
    ${["A","B"].map(v=>`<button class="typeBtn ${letter===v?"on":""}" data-type-key="${key}" data-type-value="${v}" aria-pressed="${letter===v}" aria-label="Force workout ${v}">${v}</button>`).join("")}
    ${override?`<button class="typeAuto" data-type-key="${key}" data-type-value="auto" aria-label="Clear the manual workout type">clear</button>`:`<span class="typeAutoNote">auto</span>`}
    ${dateField("workout",key,dateIso,label+" date",{bare:true,cls:"typeRowDate"})}
  </div>${!dateIso&&opts.hint?`<div class="dateHintRow">${esc(opts.hint)}</div>`:""}`;
  const rows=exercises.map((ex,ei)=>
    `<div class="strengthRow">
      <span class="exercise">${esc(ex)}</span>
      <span class="sets">
        ${[0,1,2].map(si=>{
          const k=setKeyFor(ref,ex,si);
          const previous=previousSetValue(prior,ex,si);
          const aria=`${label} ${ex} set ${si+1}${previous?`, previous ${previous}`:""}`;
          const enterHint=ei===exercises.length-1&&si===2?"done":"next";
          return `<input class="setInput" type="text" data-set="${esc(k)}" data-wkey="${key}" data-ei="${ei}" data-si="${si}" data-previous="${esc(previous)}" value="${esc(st.sets[k]??"")}" placeholder="${esc(previous||"-")}" inputmode="numeric" pattern="[0-9]*" enterkeyhint="${enterHint}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${esc(aria)}">`;
        }).join("")}
      </span>
      <button class="exDelete" data-ex-remove="${key}" data-ex-name="${esc(ex)}" aria-label="Remove ${esc(ex)} from this workout" title="Remove exercise">✕</button>
    </div>`).join("")||`<p class="exEmpty">No exercises in this workout yet.</p>`;
  const custom=Array.isArray(st.workoutExercises[key]);
  const isTemplate=custom&&sameList(exercises,templateFor(letter));
  const editor=`<div class="exAddRow">
    <input class="exAddInput" type="text" data-ex-input="${key}" list="exerciseNames" placeholder="+ add exercise" enterkeyhint="done" autocomplete="off" autocapitalize="words" spellcheck="false" aria-label="Add an exercise to ${esc(label)}">
    <button class="exAddBtn" data-ex-add="${key}" type="button" aria-label="Add exercise">Add</button>
  </div>
  ${custom&&!isTemplate?`<div class="exMeta">
    <button class="exMetaBtn" data-ex-default="${key}" type="button">save as default for workout ${letter}</button>
    <button class="exMetaBtn" data-ex-reset="${key}" type="button">reset to workout ${letter} default</button>
  </div>`:""}`;

  return `<div class="workout ${done?"done":""}">
    <div class="workoutHead">
      <button class="workoutCheck" data-workout="${key}" aria-pressed="${done}" aria-label="Mark workout ${letter} ${done?"not done":"done"}">
        <span class="box">${done?"✓":""}</span>
      </button>
      <button class="workoutToggle" data-workout-open="${key}" aria-expanded="${open}">
        <span class="workoutTitle">WORKOUT ${letter}</span>${override?`<span class="typeFlag">SET</span>`:""}<span class="caret">${open?"▾":"▸"}</span>
      </button>
      ${opts.deletable?`<button class="entryDelete" data-delete-entry="${key}" aria-label="Delete workout entry" title="Delete">✕</button>`:""}
    </div>
    ${open?`<div class="strength">${typeRow}${rows}${editor}${feelLog("workout",key,st.workoutFeels[key],st.workoutNotes[key],"workoutLog")}</div>`:""}
  </div>`;
}

function protocolHtml(w){
  const open=!!protoOpen[w.n];
  return `<div class="protoBlock">
    <button class="protoToggle" data-proto-open="${w.n}" aria-expanded="${open}">
      <span>PROTOCOL · ${weekSandalMinutes(w.n)} SANDAL MIN</span><span class="caret">${open?"▾":"▸"}</span>
    </button>
    ${open?`<div class="protoPanel">
      ${[0,1,2].map(i=>{
        const p=runProtocol(w.n,i);
        return `<div class="protoRun">
          <div class="protoRunName" style="color:var(--run${i+1})">RUN ${i+1}</div>
          ${blocksFor(w.n).map(([block,name,colour])=>`<div class="protoGrid">
            <span class="protoBlockName" style="color:var(${colour})">${name}</span>
            ${SEG_FIELDS.map(([field,n,unit])=>`<label class="protoField"><span>${field} <i>${unit}</i></span><input class="protoInput" type="number" min="0" step="${n===1?10:1}" inputmode="numeric" value="${esc(p[block][n])}" data-proto-week="${w.n}" data-proto-run="${i}" data-proto-block="${block}" data-proto-index="${n}" aria-label="Week ${w.n} run ${i+1} ${name} ${field} ${unit}"></label>`).join("")}
          </div>`).join("")}
        </div>`;
      }).join("")}
      <div class="protoActions"><button class="ghost" data-proto-reset="${w.n}">Reset week to default</button></div>
    </div>`:""}
  </div>`;
}

// The chart zooms to whatever range the weeks actually cover, so raising a
// protocol past the old hard-coded 25-minute ceiling keeps separating the bars.
function barHeight(){
  const values=WEEKS.map(w=>weekSandalMinutes(w.n));
  const hi=Math.max(...values), low=Math.min(...values);
  const floor=Math.max(0,low-Math.max(1,(hi-low)*0.4));
  const span=(hi-floor)||1;
  return v=>Math.max(6,Math.min(100,((v-floor)/span)*100));
}
function renderBars(){
  const cur=current();
  const height=barHeight();
  document.getElementById("bars").innerHTML=WEEKS.map(w=>{
    const pct=height(weekSandalMinutes(w.n));
    const fill=(wkCount(w)/w.runs.length)*100;
    const cls=w.n===cur.n?"cur":"";
    return `<div><i class="${cls}" style="height:${pct}%"><b style="height:${fill}%"></b></i></div>`;
  }).join("");
  document.getElementById("nums").innerHTML=WEEKS.map(w=>
    `<span class="${w.n===cur.n?"cur":""}">${weekSandalMinutes(w.n)}</span>`).join("");
}

function render(deferOpen){
  refreshOrder();
  const cur=current();
  renderBars();
  document.getElementById("exerciseNames").innerHTML=
    knownExercises().map(n=>`<option value="${esc(n)}"></option>`).join("");

  const openN=openWeekNumber();
  const tile=w=>{
    const done=wkDone(w), rounds=st.repeats[w.n]||0;
    const cls=[w.n===openN?"sel":"",w.n===cur.n?"cur":"",done?"done":""].filter(Boolean).join(" ");
    return `<button class="wkTile ${cls}" data-open="${w.n}" aria-expanded="${w.n===openN}" aria-label="Week ${w.n}, ${wkCount(w)} of 3 runs done">
      <span class="wkTileName">W${w.n}</span>
      <span class="wkTileCount">${wkCount(w)}/3</span>
      ${rounds?`<span class="wkTileRound">r${rounds+1}</span>`:""}
    </button>`;
  };
  const panel=w=>{
    const rounds=st.repeats[w.n]||0, feel=st.feel[w.n];
    let body="";
    {
      const entries=weekEntries(w.n);
      const soloAfter=slot=>entries.filter(e=>(e.after||0)===slot).map(e=>
        e.kind==="workout"
          ? `<div class="day soloDay">${workoutHtml(soloRef(e),{deletable:true,hint:entryStamp(e),label:"Standalone workout"})}</div>`
          : offDayHtml(e)).join("");

      body=protocolHtml(w)+`<div class="runs">`+soloAfter(0)+w.runs.map((r,i)=>{
        const d=!!st.done[w.n+"-"+i];
        const rk=w.n+"-"+i;
        const ro=!!runOpen[rk];
        const rm=st.runMetrics[rk]||{};
        const p=runProtocol(w.n,i);
        const strength=workoutHtml(pairedRef(w.n,i),{label:`Week ${w.n} run ${i+1}`});
        return `<div class="day" style="--accent:var(--run${i+1})"><div class="run ${d?"done":""}">
          <button class="runCheck" data-w="${w.n}" data-i="${i}" aria-pressed="${d}" aria-label="Mark run ${i+1} ${d?"not done":"done"}"><span class="box">${d?"✓":""}</span></button>
          <button class="runToggle" data-run-open="${rk}" aria-expanded="${ro}">
            <span class="runname" style="flex:1;min-width:0">RUN ${i+1}</span><span class="caret">${ro?"▾":"▸"}</span>
          </button>
        </div>${ro?`<div class="runBody">
          <span class="line"><span class="tag" style="color:var(--sandal)">SANDALS</span><span class="val">${segLabel(p.s)}</span><span class="runMinutes">${segMinutes(p.s)} min</span></span>
          ${hasBrooks(w.n)?`<span class="line"><span class="tag" style="color:var(--brooks)">BROOKS</span><span class="val">${segLabel(p.b)}</span><span class="runMinutes">${segMinutes(p.b)} min</span></span>`:""}
          <div class="runMetrics">
            <label class="runMetric">DISTANCE (MI)<input class="runMetricInput" type="number" min="0" step="0.01" inputmode="decimal" data-run-key="${rk}" data-run-metric="distance" value="${esc(rm.distance??"")}" placeholder="0.00" aria-label="Run ${i+1} distance in miles"></label>
            <label class="runMetric wide">DATE<input class="runMetricInput dateInput" type="date" data-date-kind="run" data-date-key="${rk}" value="${toDateInput(st.runAt[rk])}" aria-label="Week ${w.n} run ${i+1} date"></label>
          </div>
        </div>${feelLog("run",rk,st.runFeels[rk],st.runNotes[rk])}`:""}${strength}</div>${soloAfter(i+1)}`;
      }).join("")+`<div class="addRow">
        <button class="addBtn" data-add="workout" data-add-week="${w.n}">+ Add workout</button>
        <button class="addBtn" data-add="off" data-add-week="${w.n}">+ Add off-day</button>
      </div></div>`;

      if(wkDone(w)){
        if(!feel){
          body+=`<div class="gate"><p>How did this week compare to the last?</p><div class="row">
            ${["Better","Same","Worse"].map(f=>`<button class="pick" data-feel="${w.n}" data-v="${f}">${f}</button>`).join("")}
          </div></div>`;
        } else if(feel==="Better"){
          body+=`<div class="gate"><p style="color:var(--done);margin:0">Clear improvement. Move on to week ${Math.min(w.n+1,8)}.</p></div>`;
        } else {
          body+=`<div class="gate"><p style="color:var(--sandal)">Not clearly better — repeat this week before advancing. Repeating costs nothing.</p>
            <div class="row"><button class="solid" data-repeat="${w.n}">Repeat week ${w.n}</button>
            <button class="ghost" data-feel="${w.n}" data-v="Better">Advance anyway</button></div></div>`;
        }
      }
    }

    return `<div class="wkPanel" id="wkPanel"><div class="wkPanelInner"><div class="card wkPanelCard">
      <div class="wkPanelHead">
        <span class="wkname cur">WEEK ${w.n}</span>
        ${rounds?`<span class="round">round ${rounds+1}</span>`:""}
        <span class="count">${wkCount(w)}/3</span>
        <button class="wkClose" data-open="${w.n}" aria-label="Collapse week ${w.n}">✕</button>
      </div>${body}</div></div></div>`;
  };

  // Tiles flow six to a row; the open week's panel is injected at the end of
  // whichever row its tile sits in, so the grid opens in place.
  const openIndex=openN===null?-1:WEEKS.findIndex(w=>w.n===openN);
  document.getElementById("weeks").innerHTML=WEEKS.map((w,i)=>{
    const endOfRow=i%GRID_COLS===GRID_COLS-1||i===WEEKS.length-1;
    const showPanel=openIndex>=0&&endOfRow&&Math.floor(openIndex/GRID_COLS)===Math.floor(i/GRID_COLS);
    return tile(w)+(showPanel?panel(WEEKS[openIndex]):"");
  }).join("");

  // A render triggered by anything other than opening a week (ticking a run,
  // typing reps) must leave an already-open panel open, with no animation:
  // the class lands before first style resolution, so nothing transitions.
  const node=document.getElementById("wkPanel");
  if(node&&!deferOpen) node.classList.add("open");
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-w],[data-open],[data-feel],[data-repeat],[data-workout],[data-off-day],[data-run-open],[data-workout-open],[data-off-day-open],[data-log-type],[data-note-type],[data-add],[data-delete-entry],[data-type-key],[data-proto-open],[data-proto-reset],[data-ex-remove],[data-ex-add],[data-ex-default],[data-ex-reset]");
  if(!t) return;
  if(t.dataset.noteType){ openNote(t.dataset.noteType,t.dataset.noteKey); return; }
  if(t.dataset.w!==undefined && t.dataset.i!==undefined){
    const k=t.dataset.w+"-"+t.dataset.i;
    if(st.done[k]){ delete st.done[k]; delete st.runAt[k]; }
    else { st.done[k]=true; st.runAt[k]=new Date().toISOString(); }
  } else if(t.dataset.exRemove){
    if(!removeExercise(t.dataset.exRemove,t.dataset.exName)) return;
  } else if(t.dataset.exAdd){
    const field=document.querySelector(`[data-ex-input="${t.dataset.exAdd}"]`);
    if(!field||!addExercise(t.dataset.exAdd,field.value)) return;
    field.value="";
  } else if(t.dataset.exDefault){
    const k=t.dataset.exDefault;
    st.exerciseTemplates[typeFor(k)]=exercisesFor(k);
  } else if(t.dataset.exReset){
    delete st.workoutExercises[t.dataset.exReset];
  } else if(t.dataset.logType){
    const bucket=feelBucket(t.dataset.logType);
    const k=t.dataset.logKey, v=t.dataset.logValue;
    if(bucket[k]===v) delete bucket[k]; else bucket[k]=v;
  } else if(t.dataset.add){
    if(!addEntry(t.dataset.add,Number(t.dataset.addWeek))) return;
  } else if(t.dataset.deleteEntry){
    if(!deleteEntry(t.dataset.deleteEntry)) return;
  } else if(t.dataset.typeKey){
    const k=t.dataset.typeKey, v=t.dataset.typeValue;
    const clearing=v==="auto"||st.workoutTypeOverride[k]===v;
    if(clearing){ delete st.workoutTypeOverride[k]; delete st.workoutType[k]; }
    else st.workoutTypeOverride[k]=v;
    refreshOrder();
    if(st.workouts[k]){
      st.workoutType[k]=typeFor(k);
      refreshOrder();
      const ref=refFor(k);
      if(ref) recordCompletedSession(ref);
    }
  } else if(t.dataset.workout){
    const k=t.dataset.workout;
    const ref=refFor(k);
    if(!ref) return;
    if(st.workouts[k]){
      delete st.workouts[k];
      delete st.workoutAt[k];
      if(!st.workoutTypeOverride[k]) delete st.workoutType[k];
      removeCurrentSession(ref);
      workoutOpen[k]=true;
    } else {
      refreshOrder();
      st.workouts[k]=true;
      st.workoutType[k]=typeFor(k);
      if(ref.scope==="run") st.workoutAt[k]=new Date().toISOString();
      st.workoutExercises[k]=exercisesFor(k);
      refreshOrder();
      recordCompletedSession(ref);
      workoutOpen[k]=false;
    }
  } else if(t.dataset.offDay){
    const k=t.dataset.offDay;
    if(st.offDayDone[k]) delete st.offDayDone[k]; else st.offDayDone[k]=true;
  } else if(t.dataset.runOpen){
    const k=t.dataset.runOpen;
    runOpen[k]=!runOpen[k];
    render(); return;
  } else if(t.dataset.workoutOpen){
    const k=t.dataset.workoutOpen;
    workoutOpen[k]=!workoutOpen[k];
    render(); return;
  } else if(t.dataset.offDayOpen){
    const k=t.dataset.offDayOpen;
    offDayOpen[k]=!offDayOpen[k];
    render(); return;
  } else if(t.dataset.protoOpen){
    const n=t.dataset.protoOpen;
    protoOpen[n]=!protoOpen[n];
    render(); return;
  } else if(t.dataset.protoReset){
    const n=Number(t.dataset.protoReset);
    if(!confirm(`Reset the week ${n} protocol to its default splits?`)) return;
    proto[n]=defaultWeekProtocol(n);
    saveProtocol();
    render(); return;
  } else if(t.dataset.open){
    const n=+t.dataset.open;
    const showing=openWeekNumber();
    if(showing===n) closePanel(()=>{ openWeek=-1; render(); });
    else if(showing===null) revealWeek(n);
    else closePanel(()=>revealWeek(n));
    return;
  } else if(t.dataset.feel){
    st.feel[t.dataset.feel]=t.dataset.v;
  } else if(t.dataset.repeat){
    const n=+t.dataset.repeat, w=WEEKS[n-1];
    w.runs.forEach((_,i)=>delete st.done[n+"-"+i]);
    const clearWeek=bucket=>Object.keys(bucket).forEach(k=>{ if(k.startsWith(n+"-")) delete bucket[k]; });
    ["workouts","workoutOpen","runFeels","runNotes","runMetrics","workoutFeels","workoutNotes",
     "offDayDone","offDayFeels","offDayNotes","workoutAt","workoutType","workoutTypeOverride",
     "runAt","workoutExercises"].forEach(b=>clearWeek(st[b]));
    // Set keys are "<week>-<run>|<exercise>|<set>", so match on the workout key.
    Object.keys(st.sets).forEach(k=>{ if(k.startsWith(n+"-")) delete st.sets[k]; });
    [runOpen,workoutOpen,offDayOpen].forEach(clearWeek);
    // Migrated off-day rows clear with the rest of the week; standalone entries
    // you created yourself are kept — they are dated records of their own.
    st.entries=st.entries.filter(e=>!(e&&e.migrated&&e.week===n));
    delete st.feel[n];
    st.repeats[n]=(st.repeats[n]||0)+1;
  }
  save(); render();
});

// --- rep input navigation ----------------------------------------------
const repNav=document.getElementById("repNav");
const repBack=document.getElementById("repBack");
const repNext=document.getElementById("repNext");
const repDone=document.getElementById("repDone");
const repPosition=document.getElementById("repPosition");
let activeRep=null;
// Column-major circuit order for one workout's set boxes: every exercise's
// Set 1 box top-to-bottom, then every Set 2 box, then every Set 3 box —
// explicitly sorted by (set index, exercise index), never by DOM/tab order.
function circuitFields(wkey){
  return Array.from(document.querySelectorAll(".setInput"))
    .filter(el=>el.dataset.wkey===wkey)
    .sort((a,b)=>(Number(a.dataset.si)-Number(b.dataset.si))||(Number(a.dataset.ei)-Number(b.dataset.ei)));
}
function fitRepNav(){
  if(repNav.hidden) return;
  const vv=window.visualViewport;
  const visibleBottom=vv?vv.offsetTop+vv.height:window.innerHeight;
  repNav.style.bottom="auto";
  repNav.style.top=Math.max(8,visibleBottom-repNav.offsetHeight-8)+"px";
}
function updateRepNav(){
  const fields=activeRep?circuitFields(activeRep.dataset.wkey):[];
  const index=fields.indexOf(activeRep);
  repBack.disabled=index<=0;
  repNext.disabled=index<0;
  repPosition.textContent=index>=0?`${index+1} / ${fields.length}`:"";
  requestAnimationFrame(fitRepNav);
}
function showRepNav(input){
  activeRep=input;
  repNav.hidden=false;
  updateRepNav();
}
function hideRepNav(){
  repNav.hidden=true;
  repNav.style.top=""; repNav.style.bottom="";
  activeRep=null;
}
// Next: skip forward past boxes that already hold a value, landing on the
// next empty one in circuit order; dismiss the keyboard once none remain.
// Back: step to the immediately preceding box (no skipping), so a value
// just auto-filled or typed can still be corrected.
function moveRep(direction){
  if(!activeRep) return;
  const fields=circuitFields(activeRep.dataset.wkey);
  const index=fields.indexOf(activeRep);
  if(index<0) return;
  let target=null;
  if(direction>0){
    for(let i=index+1;i<fields.length;i++){
      if(!fields[i].value){ target=fields[i]; break; }
    }
  } else {
    target=fields[index-1]||null;
  }
  if(!target){
    if(direction>0) finishRep();
    return;
  }
  // Focus synchronously in the event handler — on iOS Safari, deferring
  // (rAF, timeout, promise) drops the keyboard and it won't reliably reopen.
  target.focus({preventScroll:true});
  target.scrollIntoView({block:"center",inline:"nearest"});
  showRepNav(target);
}
function finishRep(){
  const input=activeRep;
  if(input){
    input.dispatchEvent(new Event("change",{bubbles:true}));
    save();
    input.blur();
  }
  hideRepNav();
}
repNav.addEventListener("pointerdown",e=>{
  if(e.target.closest("button")) e.preventDefault();
});
repBack.addEventListener("click",()=>moveRep(-1));
repNext.addEventListener("click",()=>moveRep(1));
repDone.addEventListener("click",finishRep);
if(window.visualViewport){
  window.visualViewport.addEventListener("resize",fitRepNav);
  window.visualViewport.addEventListener("scroll",fitRepNav);
}
window.addEventListener("resize",fitRepNav);

document.addEventListener("input",e=>{
  if(e.target.matches("[data-set]")){
    const k=e.target.dataset.set, wkey=e.target.dataset.wkey;
    if(e.target.value) st.sets[k]=e.target.value; else delete st.sets[k];
    const ref=refFor(wkey);
    if(ref&&st.workouts[wkey]) recordCompletedSession(ref);
  } else if(e.target.matches("[data-run-metric]")){
    const k=e.target.dataset.runKey, metric=e.target.dataset.runMetric;
    if(!st.runMetrics[k]) st.runMetrics[k]={};
    if(e.target.value!=="") st.runMetrics[k][metric]=e.target.value;
    else delete st.runMetrics[k][metric];
    if(!Object.keys(st.runMetrics[k]).length) delete st.runMetrics[k];
  } else if(e.target.matches("[data-proto-week]")){
    const wn=Number(e.target.dataset.protoWeek), i=Number(e.target.dataset.protoRun),
          block=e.target.dataset.protoBlock, n=Number(e.target.dataset.protoIndex);
    const num=Number(e.target.value);
    proto[wn][i][block][n]=(e.target.value!==""&&Number.isFinite(num)&&num>=0)?num:0;
    saveProtocol();
    renderBars();
    return;
  } else if(e.target.id==="noteText"){
    writeNote();
  } else {
    return;
  }
  save();
});

// Date pickers commit on change, not on every keystroke, so the row does not
// re-sort under the user mid-edit.
document.addEventListener("change",e=>{
  if(!e.target.matches("[data-date-kind]")) return;
  applyDateEdit(e.target.dataset.dateKind,e.target.dataset.dateKey,e.target.value);
  save(); render();
});

document.addEventListener("focusin",e=>{
  if(!e.target.matches("[data-set]")) return;
  showRepNav(e.target);
  if(e.target.value||!e.target.dataset.previous) return;
  e.target.value=e.target.dataset.previous;
  const k=e.target.dataset.set, wkey=e.target.dataset.wkey;
  st.sets[k]=e.target.value;
  const ref=refFor(wkey);
  if(ref&&st.workouts[wkey]) recordCompletedSession(ref);
  save();
  requestAnimationFrame(()=>e.target.select());
});

document.addEventListener("focusout",e=>{
  if(!e.target.matches("[data-set]")) return;
  setTimeout(()=>{
    if(!document.activeElement||!document.activeElement.matches("[data-set]")) hideRepNav();
  },0);
});

// --- note modal ---------------------------------------------------------
// Notes share the same modal while remaining separate by entry type.
let noteCtx=null;
const noteModal=document.getElementById("noteModal");
const noteText=document.getElementById("noteText");

function writeNote(){
  if(!noteCtx) return;
  const bucket=noteBucket(noteCtx.type);
  if(noteText.value) bucket[noteCtx.k]=noteText.value; else delete bucket[noteCtx.k];
}
// Keep the sheet inside the visual viewport so the iOS keyboard never covers it.
function fitViewport(){
  const vv=window.visualViewport;
  if(!vv) return;
  noteModal.style.height=vv.height+"px";
  noteModal.style.transform="translateY("+vv.offsetTop+"px)";
  noteModal.classList.toggle("kb",vv.height<window.innerHeight-120);
}
function openNote(type,k){
  noteCtx={type,k};
  const bucket=noteBucket(type);
  const label=type==="run"?"RUN":type==="workout"?"WORKOUT":"OFF DAY";
  document.getElementById("noteModalTitle").textContent=`${label} NOTE`;
  noteText.placeholder=type==="off"?"How do you feel today?":"Brief notes on the run/workout";
  noteText.value=bucket[k]||"";
  noteModal.hidden=false;
  document.body.style.overflow="hidden";
  fitViewport();
  if(window.visualViewport){
    visualViewport.addEventListener("resize",fitViewport);
    visualViewport.addEventListener("scroll",fitViewport);
  }
  noteText.focus();
  noteText.setSelectionRange(noteText.value.length,noteText.value.length);
}
function closeNote(){
  if(!noteCtx) return;
  writeNote();
  noteCtx=null;
  noteText.blur();
  noteModal.hidden=true;
  noteModal.style.height=""; noteModal.style.transform=""; noteModal.classList.remove("kb");
  document.body.style.overflow="";
  if(window.visualViewport){
    visualViewport.removeEventListener("resize",fitViewport);
    visualViewport.removeEventListener("scroll",fitViewport);
  }
  save(); render();
}
document.getElementById("noteDone").addEventListener("click",closeNote);
noteModal.addEventListener("click",e=>{ if(e.target===noteModal) closeNote(); });
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeNote();closeDataMenu();}
  if(e.key==="Enter"&&e.target.matches&&e.target.matches("[data-set]")){
    e.preventDefault();
    moveRep(1);
  }
  if(e.key==="Enter"&&e.target.matches&&e.target.matches("[data-ex-input]")){
    e.preventDefault();
    if(!addExercise(e.target.dataset.exInput,e.target.value)) return;
    e.target.value="";
    save(); render();
  }
});

// --- export and GitHub backup ------------------------------------------
const dataMenuButton=document.getElementById("dataMenuButton");
const dataMenu=document.getElementById("dataMenu");
const dataStatus=document.getElementById("dataStatus");
function closeDataMenu(){
  dataMenu.hidden=true;
  dataMenuButton.setAttribute("aria-expanded","false");
}
dataMenuButton.addEventListener("click",e=>{
  e.stopPropagation();
  const opening=dataMenu.hidden;
  dataMenu.hidden=!opening;
  dataMenuButton.setAttribute("aria-expanded",String(opening));
});
dataMenu.addEventListener("click",e=>e.stopPropagation());
document.addEventListener("click",closeDataMenu);
function setDataStatus(message,type=""){
  dataStatus.textContent=message;
  dataStatus.className=`dataStatus ${type}`.trim();
}
function gatherSnapshot(){
  const data={};
  SNAPSHOT_KEYS.forEach(key=>{
    const value=localStorage.getItem(key);
    if(value!==null) data[key]=value;
  });
  return {schemaVersion:1,app:"sandal-transition-tracker",exportedAt:new Date().toISOString(),localStorage:data,excludedKeys:[GH_KEYS.token]};
}
const serializeSnapshot=()=>JSON.stringify(gatherSnapshot(),null,2);
function localDate(){
  const d=new Date(), pad=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
document.getElementById("exportFile").addEventListener("click",()=>{
  try{
    const json=serializeSnapshot();
    const url=URL.createObjectURL(new Blob([json],{type:"application/json"}));
    const a=document.createElement("a");
    a.href=url; a.download=`runtracker-${localDate()}.json`; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    setDataStatus("Export downloaded.","ok");
  }catch(e){setDataStatus(`Export failed: ${e.message}`,"error");}
});
async function copyText(text){
  if(navigator.clipboard&&window.isSecureContext) return navigator.clipboard.writeText(text);
  const area=document.createElement("textarea");
  area.value=text; area.style.position="fixed"; area.style.opacity="0";
  document.body.appendChild(area); area.select();
  const ok=document.execCommand("copy"); area.remove();
  if(!ok) throw new Error("Clipboard access was denied");
}
document.getElementById("copyJson").addEventListener("click",async()=>{
  try{await copyText(serializeSnapshot());setDataStatus("JSON copied to clipboard.","ok");}
  catch(e){setDataStatus(`Copy failed: ${e.message}`,"error");}
});
function githubSettings(){
  let token=localStorage.getItem(GH_KEYS.token);
  let owner=localStorage.getItem(GH_KEYS.owner);
  let repo=localStorage.getItem(GH_KEYS.repo);
  let branch=localStorage.getItem(GH_KEYS.branch)||"main";
  if(!token) token=prompt("GitHub fine-grained token (one-repo Contents read/write only):","");
  if(token&&!owner) owner=prompt("GitHub repository owner:","");
  if(token&&owner&&!repo) repo=prompt("GitHub repository name:","");
  if(token&&owner&&repo&&!localStorage.getItem(GH_KEYS.branch)){
    const enteredBranch=prompt("GitHub branch:",branch);
    if(enteredBranch===null) return null;
    branch=enteredBranch.trim()||branch;
  }
  token=token&&token.trim(); owner=owner&&owner.trim(); repo=repo&&repo.trim(); branch=branch&&branch.trim();
  if(!token||!owner||!repo||!branch) return null;
  localStorage.setItem(GH_KEYS.token,token);
  localStorage.setItem(GH_KEYS.owner,owner);
  localStorage.setItem(GH_KEYS.repo,repo);
  localStorage.setItem(GH_KEYS.branch,branch);
  return {token,owner,repo,branch};
}
async function githubError(response){
  let detail="";
  try{const body=await response.json();detail=body.message||JSON.stringify(body);}catch(e){detail=await response.text();}
  return `${response.status} ${detail||response.statusText}`.trim();
}
function utf8Base64(text){
  const bytes=new TextEncoder().encode(text);
  let binary="";
  for(let i=0;i<bytes.length;i+=0x8000) binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));
  return btoa(binary);
}
document.getElementById("saveGithub").addEventListener("click",async()=>{
  const settings=githubSettings();
  if(!settings){setDataStatus("GitHub save cancelled; settings were not changed.","error");return;}
  const button=document.getElementById("saveGithub");
  const label=button.querySelector(".dataMenuLabel");
  button.disabled=true; label.textContent="Saving..."; setDataStatus("Checking data.json on GitHub...");
  try{
    const path=`https://api.github.com/repos/${encodeURIComponent(settings.owner)}/${encodeURIComponent(settings.repo)}/contents/data.json`;
    const headers={Accept:"application/vnd.github+json",Authorization:`Bearer ${settings.token}`,"X-GitHub-Api-Version":"2022-11-28"};
    const getResponse=await fetch(`${path}?ref=${encodeURIComponent(settings.branch)}`,{headers});
    let sha;
    if(getResponse.ok){sha=(await getResponse.json()).sha;}
    else if(getResponse.status!==404){throw new Error(await githubError(getResponse));}
    const json=serializeSnapshot();
    const body={message:`Update run tracker data ${new Date().toISOString()}`,content:utf8Base64(json),branch:settings.branch};
    if(sha) body.sha=sha;
    const putResponse=await fetch(path,{method:"PUT",headers:{...headers,"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!putResponse.ok) throw new Error(await githubError(putResponse));
    const result=await putResponse.json();
    const shortSha=result.commit&&result.commit.sha?` (${result.commit.sha.slice(0,7)})`:"";
    setDataStatus(`Committed data.json successfully${shortSha}.`,"ok");
  }catch(e){setDataStatus(`GitHub save failed: ${e.message}`,"error");}
  finally{button.disabled=false;label.textContent="Save to GitHub";}
});

load(); render();
</script>
